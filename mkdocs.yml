site_name: Kafka Mastery Path
site_description: A free Apache Kafka course — topics, partitions and the log, producers and consumers, delivery semantics, replication, Kafka Connect, Kafka Streams, and running a real KRaft cluster.
site_url: https://sigilipelli.github.io/kafka-mastery-path/
repo_url: https://github.com/sigilipelli/kafka-mastery-path
repo_name: kafka-mastery-path

theme:
  name: material
  favicon: assets/favicon.svg
  custom_dir: docs/overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css
  - stylesheets/progress-tracker.css

extra_javascript:
  - javascripts/progress-tracker.js

nav:
  - Home: index.md
  - Privacy Policy: privacy.md
  - License: license.md
  - "Level 1 · The Log, Topics & Partitions":
      - Overview: level-1/index.md
      - "01 · What Kafka Actually Is: The Log-Based Messaging Model": level-1/01-what-kafka-is.md
      - "02 · Brokers, Clusters & KRaft": level-1/02-brokers-clusters-kraft.md
      - "03 · Topics & Partitions: How the Log Is Really Stored": level-1/03-topics-partitions-log.md
      - "04 · Producers: Keys, Partitioning & Batching": level-1/04-producers-keys-batching.md
      - "05 · Consumers & Consumer Groups": level-1/05-consumers-consumer-groups.md
      - "06 · The New Consumer Rebalance Protocol (KIP-848) vs Classic": level-1/06-rebalance-protocols.md
      - "07 · Replication: Leaders, Followers & the ISR": level-1/07-replication-isr.md
      - "08 · Delivery Semantics: At-Most-Once, At-Least-Once & Idempotence": level-1/08-delivery-semantics.md
      - "09 · Retention & Compaction": level-1/09-retention-compaction.md
      - "10 · Project — A Producer/Consumer Pipeline with Partition Keys": level-1/10-project-producer-consumer-pipeline.md
  - "Level 2 · Operating a Cluster":
