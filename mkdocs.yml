      - "03 · Consumer Configuration & Fetch Tuning": level-2/03-consumer-configuration.md
      - "04 · Exactly-Once Semantics: Idempotence & Transactions": level-2/04-exactly-once-transactions.md
      - "05 · Monitoring: The Metrics That Actually Matter": level-2/05-monitoring-metrics.md
      - "06 · Log Segments, Indexes & Cleanup in Practice": level-2/06-segments-indexes-cleanup.md
      - "07 · Security: SASL, SSL & ACLs": level-2/07-security-sasl-ssl-acls.md
      - "08 · Partition Reassignment & Scaling a Cluster": level-2/08-reassignment-scaling.md
      - "09 · Quotas & Multi-Tenancy": level-2/09-quotas-multi-tenancy.md
      - "10 · Project — Diagnose a Consumer Lag Problem": level-2/10-project-consumer-lag.md
  - "Level 3 · Kafka Connect & Kafka Streams":
