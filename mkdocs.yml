      - "05 · Streams Stateful Operations & State Stores": level-3/05-streams-state-stores.md
      - "06 · Streams Joins & Windowing": level-3/06-streams-joins-windowing.md
      - "07 · Changelog Topics & Fault Tolerance": level-3/07-changelog-fault-tolerance.md
      - "08 · Schema Evolution: Avro/Protobuf & Compatibility": level-3/08-schema-evolution.md
      - "09 · Error Handling: Dead Letter Queues & Retries": level-3/09-error-handling-dlq.md
      - "10 · Project — A Real Kafka Streams Application": level-3/10-project-streams-application.md
  - "Level 4 · Production Kafka & Capstone":
